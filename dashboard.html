<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>むぜ ダッシュボード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1b1b21; color: #e8e8e8; font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; padding: 12px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  header h1 { font-size: 18px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
  .dot.on { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .layout { display: flex; gap: 12px; align-items: stretch; }
  .left { width: 372px; flex: none; display: flex; flex-direction: column; gap: 12px; }
  .right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  /* Minecraft GUI style panel */
  .gui { background: #c6c6c6; border: 3px solid; border-color: #ffffff #555555 #555555 #ffffff; padding: 10px; color: #3f3f3f; }
  .gui h2 { font-size: 13px; color: #3f3f3f; margin-bottom: 8px; font-weight: 600; }
  .slot { width: 36px; height: 36px; background: #8b8b8b; border: 2px solid; border-color: #373737 #ffffff #ffffff #373737; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .slot .nm { font-size: 8px; line-height: 1.15; color: #fff; text-shadow: 1px 1px 0 #3f3f3f; text-align: center; word-break: break-all; padding: 1px; }
  .slot .ct { position: absolute; right: 1px; bottom: 0; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 #3f3f3f; }
  .grid9 { display: grid; grid-template-columns: repeat(9, 36px); gap: 0; }
  .inv-top { display: flex; gap: 8px; margin-bottom: 8px; }
  .armor-col { display: grid; grid-template-rows: repeat(4, 36px); gap: 0; }
  .player-box { flex: 1; background: #22222a; border: 2px solid; border-color: #373737 #ffffff #ffffff #373737; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9fd8a8; min-height: 144px; }
  .player-box .face { width: 48px; height: 48px; background: #7ec8e3; border: 3px solid #4a7a8c; margin-bottom: 6px; }
  .player-box .pname { font-size: 13px; color: #e8e8e8; }
  .craft { display: flex; align-items: center; gap: 6px; }
  .craft-grid { display: grid; grid-template-columns: repeat(2, 36px); }
  .craft .arrow { font-size: 18px; color: #3f3f3f; }
  .offhand-row { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  .lbl { font-size: 10px; color: #555; }
  .sep { height: 6px; }
  /* info panel */
  .info { background: #26262e; border: 1px solid #3a3a44; padding: 12px; }
  .info h2 { font-size: 13px; margin-bottom: 8px; color: #bdbdc7; }
  .info .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px dashed #34343e; }
  .info .row:last-child { border-bottom: none; }
  .bar { height: 8px; background: #3a3a44; border-radius: 4px; overflow: hidden; margin: 2px 0 6px; }
  .bar > div { height: 100%; }
  .hp > div { background: #e5484d; }
  .fd > div { background: #e8a13a; }
  .xp > div { background: #7ee24a; }
  /* view panel */
  .view-head { background: #26262e; border: 1px solid #3a3a44; border-bottom: none; padding: 8px 12px; font-size: 14px; display: flex; gap: 18px; flex-wrap: wrap; }
  .view-wrap { position: relative; flex: 1; min-height: 420px; background: #000; border: 1px solid #3a3a44; }
  .view-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .hotbar-strip { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; display: flex; gap: 2px; background: rgba(20,20,20,.55); padding: 3px; border: 2px solid rgba(255,255,255,.35); }
  .hotbar-strip .slot { width: 44px; height: 44px; background: rgba(139,139,139,.85); }
  .hotbar-strip .slot.sel { border-color: #ffffff; box-shadow: 0 0 0 2px #fff, 0 0 10px #fff; z-index: 1; }
  .hotbar-strip .slot .nm { font-size: 9px; }
  .err { color: #e5484d; font-size: 12px; }
  .cmdbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: #26262e; border: 1px solid #3a3a44; padding: 8px; margin-bottom: 12px; }
  .cmdbar button { background: #3a3a44; color: #e8e8e8; border: 1px solid #55555f; padding: 6px 10px; font-size: 13px; cursor: pointer; border-radius: 4px; }
  .cmdbar button:hover { background: #4a4a56; }
  .cmdbar input { flex: 1; min-width: 140px; background: #1b1b21; color: #e8e8e8; border: 1px solid #55555f; padding: 6px 8px; font-size: 13px; border-radius: 4px; }
  .cmdbar .sent { font-size: 12px; color: #7ee24a; }
  .settings { background: #26262e; border: 1px solid #3a3a44; padding: 12px; }
  .settings h2 { font-size: 13px; margin-bottom: 8px; color: #bdbdc7; }
  .settings .srow { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed #34343e; }
  .settings .srow:last-child { border-bottom: none; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: #55555f; border-radius: 11px; transition: .15s; cursor: pointer; }
  .switch .track:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #e8e8e8; border-radius: 50%; transition: .15s; }
  .switch input:checked + .track { background: #4caf50; }
  .switch input:checked + .track:before { transform: translateX(18px); }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>むぜ ダッシュボード</h1>
  <span id="conn" style="font-size:12px;color:#9a9aa5;">接続中…</span>
</header>
<div class="cmdbar">
  <button data-cmd="木のツルハシ作って">🪓 木のツルハシ作って</button>
  <button data-cmd="木切って">木切って</button>
  <button data-cmd="もちもの">もちもの</button>
  <button data-cmd="一人でサバイバル">一人でサバイバル</button>
  <button data-cmd="拠点つくって">🏠 拠点つくって</button>
  <button data-cmd="うちかえる">拠点へ帰る</button>
  <button data-cmd="預けて">チェストに預ける</button>
  <button data-cmd="ベッド作って">🛏 ベッド作って</button>
  <button data-cmd="覚えてること">覚えてること</button>
  <button data-cmd="とまれ">とまれ</button>
  <input id="cmd-input" type="text" placeholder="コマンドを入力（例：木のツルハシ作って）" maxlength="100">
  <button id="cmd-send">送信</button>
  <span class="sent" id="cmd-sent"></span>
</div>
<div class="layout">
  <div class="left">
    <div class="gui">
      <h2>インベントリ</h2>
      <div class="inv-top">
        <div class="armor-col" id="armor"></div>
        <div class="player-box">
          <div class="face"></div>
          <div class="pname">Muze</div>
          <div style="font-size:11px;color:#9a9aa5;" id="pb-sub">—</div>
        </div>
        <div>
          <div class="lbl">クラフト</div>
          <div class="craft">
            <div class="craft-grid" id="craft"></div>
            <div class="arrow">➜</div>
            <div id="craft-result"></div>
          </div>
          <div class="offhand-row">
            <span class="lbl">オフ<br>ハンド</span>
            <div id="offhand"></div>
          </div>
        </div>
      </div>
      <div class="grid9" id="main"></div>
      <div class="sep"></div>
      <div class="grid9" id="hotbar"></div>
    </div>
    <div class="info">
      <h2>その他情報</h2>
      <div class="row"><span>体力</span><span id="hp-num">—</span></div>
      <div class="bar hp"><div id="hp-bar" style="width:0%"></div></div>
      <div class="row"><span>満腹度</span><span id="fd-num">—</span></div>
      <div class="bar fd"><div id="fd-bar" style="width:0%"></div></div>
      <div class="row"><span>経験値レベル</span><span id="xp-num">—</span></div>
      <div class="bar xp"><div id="xp-bar" style="width:0%"></div></div>
      <div class="row"><span>座標</span><span id="pos">—</span></div>
      <div class="row"><span>ディメンション</span><span id="dim">—</span></div>
      <div class="row"><span>ゲーム内時刻</span><span id="gtime">—</span></div>
      <div class="row"><span>モード</span><span id="mode">—</span></div>
      <div class="row"><span>オンライン</span><span id="players">—</span></div>
      <div class="row"><span>現在の行動</span><span id="activity">—</span></div>
      <div class="row"><span>拠点</span><span id="home">—</span></div>
    </div>
    <div class="settings">
      <h2>設定（自動ですること）</h2>
      <div class="srow"><span>お腹が減ったら自動で食べる</span><label class="switch"><input type="checkbox" id="set-autoEat"><span class="track"></span></label></div>
      <div class="srow"><span>近くのモンスターを自動で倒す</span><label class="switch"><input type="checkbox" id="set-autoFight"><span class="track"></span></label></div>
      <div class="srow"><span>ドロップ品を自動で拾いに行く</span><label class="switch"><input type="checkbox" id="set-autoPickup"><span class="track"></span></label></div>
      <div class="srow"><span>夜は拠点に帰る（なければ動き回る）</span><label class="switch"><input type="checkbox" id="set-nightSurvival"><span class="track"></span></label></div>
      <div class="srow"><span>死んだら落下物を取りに戻る</span><label class="switch"><input type="checkbox" id="set-autoRecover"><span class="track"></span></label></div>
      <div class="srow"><span>防具を自動で装備する</span><label class="switch"><input type="checkbox" id="set-autoEquip"><span class="track"></span></label></div>
    </div>
    <div class="info">
      <h2>ログ（最新15件）</h2>
      <div id="logs" style="font-size:11px;line-height:1.5;color:#bdbdc7;word-break:break-all;">—</div>
    </div>
    <div class="info">
      <h2>記憶</h2>
      <div class="row"><span>チェストの中身</span><span id="mem-chest">—</span></div>
      <div class="row"><span>木が取れた場所</span><span id="mem-forest">—</span></div>
      <div class="row"><span>石が掘れた場所</span><span id="mem-stone">—</span></div>
      <div class="row"><span>ベッド</span><span id="mem-bed">—</span></div>
      <div class="row"><span>最後に死んだ場所</span><span id="mem-death">—</span></div>
    </div>
  </div>
  <div class="right">
    <div class="view-head">
      <span>座標 <b id="v-pos">—</b></span>
      <span>方角 <b id="v-dir">—</b></span>
      <span id="v-day">—</span>
    </div>
    <div class="view-wrap">
      <iframe id="view" title="むぜの視点"></iframe>
      <div class="hotbar-strip" id="hotbar-strip"></div>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  $('view').src = location.protocol + '//' + location.hostname + ':3007/';
  function slotEl(item, extraCls) {
    const d = document.createElement('div');
    d.className = 'slot' + (extraCls ? ' ' + extraCls : '');
    if (item) {
      d.title = item.displayName + ' (' + item.name + ')';
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = item.displayName;
      d.appendChild(nm);
      if (item.count > 1) { const ct = document.createElement('div'); ct.className = 'ct'; ct.textContent = item.count; d.appendChild(ct); }
    }
    return d;
  }
  function fill(el, items) { el.innerHTML = ''; items.forEach(it => el.appendChild(slotEl(it))); }
  function compass(yaw) {
    const deg = ((Math.round(-yaw * 180 / Math.PI) + 180) % 360 + 360) % 360;
    const dirs = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
    return dirs[Math.round(deg / 45) % 8];
  }
  async function tick() {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      const s = await r.json();
      $('dot').className = 'dot' + (s.online ? ' on' : '');
      $('conn').textContent = s.online ? 'オンライン' : 'スポーン待ち';
      fill($('armor'), [s.armor.helmet, s.armor.chestplate, s.armor.leggings, s.armor.boots]);
      fill($('craft'), s.crafting.slots);
      fill($('craft-result'), [s.crafting.result]);
      fill($('offhand'), [s.offhand]);
      fill($('main'), s.main);
      fill($('hotbar'), s.hotbar);
      const strip = $('hotbar-strip'); strip.innerHTML = '';
      s.hotbar.forEach((it, i) => strip.appendChild(slotEl(it, i === s.heldSlot ? 'sel' : '')));
      $('pb-sub').textContent = 'Lv ' + s.xpLevel + ' / ' + (s.gameMode || '');
      $('hp-num').textContent = (Math.round(s.health * 10) / 10) + ' / 20';
      $('hp-bar').style.width = (s.health / 20 * 100) + '%';
      $('fd-num').textContent = s.food + ' / 20';
      $('fd-bar').style.width = (s.food / 20 * 100) + '%';
      $('xp-num').textContent = 'Lv ' + s.xpLevel;
      $('xp-bar').style.width = (s.xpProgress * 100) + '%';
      const p = s.position;
      const posTxt = 'X ' + p.x.toFixed(1) + ' / Y ' + p.y.toFixed(1) + ' / Z ' + p.z.toFixed(1);
      $('pos').textContent = posTxt; $('v-pos').textContent = posTxt;
      $('v-dir').textContent = compass(s.yaw);
      $('dim').textContent = (s.dimension || '').replace('minecraft:', '');
      const hour = Math.floor(((s.timeOfDay / 1000) + 6) % 24);
      const min = Math.floor((((s.timeOfDay / 1000) + 6) % 1) * 60);
      $('gtime').textContent = hour + ':' + String(min).padStart(2, '0') + (s.isDay ? '（昼）' : '（夜）');
      $('v-day').textContent = s.isDay ? '☀ 昼' : '🌙 夜';
      $('mode').textContent = s.gameMode || '—';
      $('players').textContent = s.players.join(', ') || '—';
      $('activity').textContent = s.activity || '—';
      $('home').textContent = s.home ? ('X ' + s.home.x + ' / Y ' + s.home.y + ' / Z ' + s.home.z) : 'なし';
      if (Array.isArray(s.logs)) {
        $('logs').innerHTML = s.logs.map(l => l.replace(/&/g, '&amp;').replace(/</g, '&lt;')).join('<br>');
      }
      if (s.memory) {
        const mc = s.memory;
        $('mem-chest').textContent = mc.chestContents && mc.chestContents.length ? mc.chestContents.map(i => i.name + '×' + i.count).join(', ') : (mc.chest ? '空' : 'なし');
        $('mem-forest').textContent = mc.spots && mc.spots.forest ? ('X ' + mc.spots.forest.x + ' / Z ' + mc.spots.forest.z) : '—';
        $('mem-stone').textContent = mc.spots && mc.spots.stone ? ('X ' + mc.spots.stone.x + ' / Z ' + mc.spots.stone.z) : '—';
        $('mem-bed').textContent = mc.bed ? ('X ' + mc.bed.x + ' / Z ' + mc.bed.z) : 'なし';
        $('mem-death').textContent = mc.lastDeath ? ('X ' + mc.lastDeath.x + ' / Z ' + mc.lastDeath.z + (mc.lastDeath.byMob ? '（モンスター）' : '')) : '—';
      }
    } catch (e) {
      $('conn').innerHTML = '<span class="err">状態APIに接続できません</span>';
    }
  }
  async function sendCmd(text) {
    const cmd = (text || '').trim();
    if (!cmd) return;
    try {
      const r = await fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: cmd }) });
      $('cmd-sent').textContent = r.ok ? ('送信: ' + cmd) : '送信に失敗';
    } catch (e) { $('cmd-sent').textContent = '送信に失敗'; }
    setTimeout(() => { $('cmd-sent').textContent = ''; }, 4000);
  }
  document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => sendCmd(b.dataset.cmd)));
  $('cmd-send').addEventListener('click', () => { sendCmd($('cmd-input').value); $('cmd-input').value = ''; });
  $('cmd-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { sendCmd($('cmd-input').value); $('cmd-input').value = ''; } });
  const SETTING_KEYS = ['autoEat', 'autoFight', 'autoPickup', 'nightSurvival', 'autoRecover', 'autoEquip'];
  async function loadSettings() {
    try {
      const r = await fetch('/api/settings', { cache: 'no-store' });
      const s = await r.json();
      SETTING_KEYS.forEach(k => { const el = $('set-' + k); if (el) el.checked = !!s[k]; });
    } catch (e) {}
  }
  SETTING_KEYS.forEach(k => {
    const el = $('set-' + k);
    if (el) el.addEventListener('change', async () => {
      try {
        const r = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: k, value: el.checked }) });
        if (!r.ok) throw new Error('ng');
        const s = await r.json();
        el.checked = !!s[k];
      } catch (e) { el.checked = !el.checked; }
    });
  });
  loadSettings();
  tick(); setInterval(tick, 1500);
</script>
</body>
</html>
